name: Watchlist leader research
on:
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * 2-6"
  push:
    branches: [main]
    paths:
      - data/user_config.json
      - data/watchlist_earnings.json
      - data/watchlist_screen.json
      - scripts/update_leader_evidence.py
      - .github/workflows/leader-research.yml
  pull_request:
    paths:
      - "**/*.py"
      - "test*.py"
      - requirements.txt
      - data/leader_research.json
      - .github/workflows/leader-research.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt beautifulsoup4
      - run: python -m unittest test_leader_research test_leader_screen test_screen_snapshot test_daily_screen test_weekly_screen
  refresh:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: refresh-watchlist-leader-evidence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Update public watchlist evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_leader_evidence.py
            git add data/leader_research.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh public watchlist research evidence"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
